<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RICF-1 Format Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<style>
  /* Apple-like, Minimalist, Modern, Glassmorphism UI */
  :root {
    --bg-color: #F5F5F7;
    --card-bg: rgba(255, 255, 255, 0.75);
    --card-border: rgba(255, 255, 255, 0.4);
    --text-main: #1D1D1F;
    --text-sub: #86868B;
    --accent: #0071E3;
    --accent-hover: #0077ED;
    --success: #34C759;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--sans);
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }

  .converter-card {
    background: var(--card-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 420px;
    padding: 40px 24px;
    box-sizing: border-box;
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .converter-card.dragover {
    transform: scale(1.02);
    box-shadow: 0 15px 50px rgba(0, 113, 227, 0.2);
    border-color: rgba(0, 113, 227, 0.5);
  }

  .icon {
    font-size: 48px;
    color: var(--accent);
    margin-bottom: 16px;
    transition: color 0.3s ease;
  }

  .converter-card.dragover .icon {
    color: var(--accent-hover);
  }

  .title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px 0;
  }

  .description {
    font-size: 14px;
    color: var(--text-sub);
    line-height: 1.5;
    margin: 0 0 24px 0;
  }

  .upload-btn {
    display: inline-block;
    background-color: var(--accent);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 980px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  .upload-btn:hover {
    background-color: var(--accent-hover);
  }

  .upload-btn:active {
    transform: scale(0.97);
  }

  input[type="file"] {
    display: none;
  }

  .status-message {
    margin-top: 20px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .status-message.show {
    opacity: 1;
    transform: translateY(0);
  }

  .status-message.success {
    color: var(--success);
  }

  .status-message.error {
    color: #FF3B30;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #1c1c1e;
      --card-bg: rgba(44, 44, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f5f5f7;
      --text-sub: #8e8e93;
    }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="converter-card" id="dropZone">
  <span class="material-symbols-outlined icon" id="statusIcon">upload_file</span>
  <h1 class="title">RICF-1 コンバーター</h1>
  <p class="description">旧形式のJSON、chartdata.txt、<br>または .mcz ファイルを変換します。</p>
  
  <label class="upload-btn">
    ファイルを選択
    <input type="file" id="fileInput">
  </label>
  
  <div class="status-message" id="statusMessage"></div>
</div>

<script>
(function() {
  "use strict";

  const RESOLUTION = 960; // RICF-1のデフォルト解像度（1拍あたりのTick数）

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const statusMessage = document.getElementById('statusMessage');
  const statusIcon = document.getElementById('statusIcon');

  // イベントリスナーの登録
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files.length > 0) {
      handleFile(e.target.files[0]);
    }
    fileInput.value = ''; // リセット
  });

  function showMessage(msg, isError = false) {
    statusMessage.textContent = msg;
    statusMessage.className = 'status-message show ' + (isError ? 'error' : 'success');
    statusIcon.textContent = isError ? 'error' : 'check_circle';
    statusIcon.style.color = isError ? '#FF3B30' : 'var(--success)';
    
    setTimeout(() => {
      statusMessage.classList.remove('show');
      setTimeout(() => {
        statusIcon.textContent = 'upload_file';
        statusIcon.style.color = 'var(--accent)';
      }, 400);
    }, 4000);
  }

  async function handleFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    
    if (ext !== 'json' && ext !== 'txt' && ext !== 'mcz') {
      showMessage('JSON, TXT, または MCZ ファイルを選択してください', true);
      return;
    }

    try {
      if (ext === 'mcz') {
        if (typeof JSZip === 'undefined') {
          showMessage('JSZipライブラリの読み込みに失敗しました', true);
          return;
        }
        
        showMessage('MCZファイルを解析中...');
        const zip = await JSZip.loadAsync(file);
        
        // Find single-digit folders and max digit
        let maxFolderDigit = -1;
        let maxFolderPrefix = "";
        
        Object.keys(zip.files).forEach(path => {
          // match single digit folders like "0/", "1/", "2/" at root level
          const matchFolder = path.match(/^(\d)\//);
          if (matchFolder) {
            const digit = parseInt(matchFolder[1], 10);
            if (digit > maxFolderDigit) {
              maxFolderDigit = digit;
              maxFolderPrefix = matchFolder[1] + "/";
            }
          }
        });
        
        if (maxFolderDigit === -1) {
          throw new Error("数値のフォルダが見つかりませんでした");
        }
        
        // Find the <number>.mc file with the highest number inside that folder
        let maxMcNum = -1;
        let targetMcPath = null;
        
        Object.keys(zip.files).forEach(path => {
          if (path.startsWith(maxFolderPrefix) && path.endsWith('.mc')) {
            const filename = path.slice(maxFolderPrefix.length);
            const matchFile = filename.match(/^(\d+)\.mc$/i);
            if (matchFile) {
              const num = parseInt(matchFile[1], 10);
              if (num > maxMcNum) {
                maxMcNum = num;
                targetMcPath = path;
              }
            }
          }
        });
        
        if (!targetMcPath) {
          throw new Error("対象の.mcファイルが見つかりませんでした");
        }
        
        const mcFile = zip.files[targetMcPath];
        const content = await mcFile.async('string');
        const oldData = JSON.parse(content);
        const newData = convertToRICF1(oldData);
        downloadJson(newData, file.name.replace(/\.mcz$/i, '_ricf1.json'));
        showMessage('MCZの変換が完了しました！');
      } else {
        // Normal JSON/TXT path
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const oldData = JSON.parse(e.target.result);
            const newData = convertToRICF1(oldData);
            downloadJson(newData, file.name.replace(/\.(json|txt)$/i, '_ricf1.json'));
            showMessage('変換が完了しました！');
          } catch (err) {
            showMessage('変換エラー: ' + err.message, true);
            console.error(err);
          }
        };
        reader.readAsText(file);
      }
    } catch (err) {
      showMessage('エラー: ' + err.message, true);
      console.error(err);
    }
  }

  // 古いJSONからRICF-1形式に変換するメイン関数
  function convertToRICF1(old) {
    let metadata, timing, notes = [];

    // Check if it's the new chartdata.txt format
    if (old.meta && Array.isArray(old.note)) {
      metadata = {
        id: old.meta.version || "001",
        title: (old.meta.song && old.meta.song.title) ? old.meta.song.title : "Unknown Title",
        artist: (old.meta.song && old.meta.song.artist) ? old.meta.song.artist : "",
        charter: old.meta.creator || "",
        difficulty: {
          name: old.meta.version || "Low",
          level: 1
        },
        audio: {
          file: old.meta.background ? old.meta.background.replace(/\.[^/.]+$/, "") + ".mp3" : "",
          offset: 0
        },
        jacket: {
          file: old.meta.background || ""
        },
        laneCount: (old.meta.mode_ext && old.meta.mode_ext.column) ? old.meta.mode_ext.column : 7,
        resolution: RESOLUTION
      };

      timing = {
        bpms: [],
        scrolls: [{ tick: 0, speed: 1.0 }],
        timeSignatures: [{ tick: 0, numerator: 4, denominator: 4 }],
        stops: []
      };

      if (Array.isArray(old.time)) {
        old.time.forEach(t => {
          if (t.beat && typeof t.bpm === 'number') {
            const beatVal = t.beat[0] + (t.beat[2] > 0 ? t.beat[1] / t.beat[2] : 0);
            const tick = Math.round(beatVal * RESOLUTION);
            timing.bpms.push({ tick: tick, bpm: t.bpm });
          }
        });
      }
      if (timing.bpms.length === 0) {
        timing.bpms.push({ tick: 0, bpm: 120.0 });
      }

      old.note.forEach(n => {
        if (typeof n.column !== 'number') return;
        
        const beatVal = n.beat[0] + (n.beat[2] > 0 ? n.beat[1] / n.beat[2] : 0);
        const tick = Math.round(beatVal * RESOLUTION);
        let lane = n.column;
        if (lane === 3) lane = 6;
        else if (lane === 4) lane = 3;
        else if (lane === 5) lane = 4;
        else if (lane === 6) lane = 5;
        let type = "tap";
        
        let newNote = {
          id: 0,
          tick: tick,
          lane: lane,
          type: type,
          size: 1
        };

        if (n.endbeat) {
          type = "hold";
          newNote.type = "hold";
          const endBeatVal = n.endbeat[0] + (n.endbeat[2] > 0 ? n.endbeat[1] / n.endbeat[2] : 0);
          newNote.endTick = Math.round(endBeatVal * RESOLUTION);
        }

        notes.push(newNote);
      });

    } else {
      // Legacy format handling (LPB / maxBlock)
      metadata = {
        id: old.name || "001",
        title: old.name || "Unknown Title",
        artist: "",
        charter: "",
        difficulty: {
          name: "Low",
          level: 1
        },
        audio: {
          file: "",
          offset: typeof old.offset === 'number' ? old.offset : 0
        },
        jacket: {
          file: ""
        },
        laneCount: typeof old.maxBlock === 'number' ? old.maxBlock : 6,
        resolution: RESOLUTION
      };

      timing = {
        bpms: [
          {
            tick: 0,
            bpm: typeof old.BPM === 'number' ? old.BPM : 120.0
          }
        ],
        scrolls: [
          { tick: 0, speed: 1.0 }
        ],
        timeSignatures: [
          { tick: 0, numerator: 4, denominator: 4 }
        ],
        stops: []
      };

      if (Array.isArray(old.notes)) {
        old.notes.forEach(n => {
          const tick = Math.round((n.num / n.LPB) * RESOLUTION);
          const lane = n.block;
          const type = n.type === 2 ? "hold" : "tap";
          
          let newNote = {
            id: 0,
            tick: tick,
            lane: lane,
            type: type,
            size: 1
          };

          if (type === "hold") {
            if (Array.isArray(n.notes) && n.notes.length > 0) {
              const endNote = n.notes[0];
              const endTick = Math.round((endNote.num / endNote.LPB) * RESOLUTION);
              newNote.endTick = endTick;
            } else {
              newNote.endTick = tick + RESOLUTION;
            }
          }
          notes.push(newNote);
        });
      }
    }

    notes.sort((a, b) => {
      if (a.tick !== b.tick) return a.tick - b.tick;
      return a.lane - b.lane;
    });

    let idCounter = 1;
    notes.forEach(n => {
      n.id = idCounter++;
    });

    return {
      version: 1,
      metadata: metadata,
      timing: timing,
      notes: notes,
      events: []
    };
  }

  // JSONをダウンロードさせる処理
  function downloadJson(data, filename) {
    const jsonStr = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

})();
</script>

</body>
</html>
