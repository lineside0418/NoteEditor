<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCF-1 Chart Editor</title>
<!-- アイコンライブラリ（Material Symbols）の読み込み -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<style>
  /* -------------------------------------------------------------
     テーマ変数定義（デフォルトはダークモード）
  ------------------------------------------------------------- */
  :root {
    --bg: #0A0D12;
    --panel: #12161D;
    --panel-border: #1E242E;
    --text: #E4E8ED;
    --text-dim: #7C8798;
    --text-faint: #4B5563;
    --grid-beat: #1B212B;
    --grid-measure: #2A323F;
    --lane-alt: #0E1218;
    --bpm-line: #C9A227;
    --tap: #FFFFFF;
    --hold: #00BFFF;
    --hold-fill: rgba(0, 191, 255, 0.3);
    --trace: #808080;
    --swap: #A020F0;
    --shift: #FFFF00;
    --scramble: #FF0000;
    --shift: #FFFF00;
    --scramble: #FF0000;
    --shift: #FFFF00;
    --scramble: #FF0000;
    --danger: #FF5C5C;
    --playhead: #FF3B5C;
    --select-box: rgba(120,170,255,0.18);
    --select-box-border: #78AAFF;
    
    /* ボタン・入力欄の変数化 */
    --btn-bg: #1A2029;
    --btn-hover: #212836;
    --btn-active: #161b23;
    --btn-border-hover: #333d4d;
    --btn-primary-bg: #1A3A38;
    --btn-primary-border: #2A5C56;
    --btn-primary-hover: #204743;
    --input-bg: #1A2029;
    --note-card-bg: #161B23;
    
    --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  }

  /* -------------------------------------------------------------
     ライトモード
  ------------------------------------------------------------- */
  [data-theme="light"] {
    --bg: #F9FAFB;
    --panel: #FFFFFF;
    --panel-border: #E5E7EB;
    --text: #111827;
    --text-dim: #6B7280;
    --text-faint: #9CA3AF;
    --grid-beat: #E5E7EB;
    --grid-measure: #D1D5DB;
    --lane-alt: #F3F4F6;
    --bpm-line: #D97706;
    --tap: #FFFFFF;
    --hold: #00BFFF;
    --hold-fill: rgba(0, 191, 255, 0.3);
    --trace: #808080;
    --swap: #A020F0;
    --danger: #DC2626;
    --playhead: #DC2626;
    --select-box: rgba(59, 130, 246, 0.15);
    --select-box-border: #3B82F6;
    
    --btn-bg: #F3F4F6;
    --btn-hover: #E5E7EB;
    --btn-active: #D1D5DB;
    --btn-border-hover: #D1D5DB;
    --btn-primary-bg: #E0F2FE;
    --btn-primary-border: #BAE6FD;
    --btn-primary-hover: #BAE6FD;
    --input-bg: #FFFFFF;
    --note-card-bg: #F9FAFB;
  }

  /* -------------------------------------------------------------
     高コントラストモード
  ------------------------------------------------------------- */
  [data-theme="high-contrast"] {
    --bg: #000000;
    --panel: #000000;
    --panel-border: #FFFFFF;
    --text: #FFFFFF;
    --text-dim: #CCCCCC;
    --text-faint: #999999;
    --grid-beat: #333333;
    --grid-measure: #FFFFFF;
    --lane-alt: #111111;
    --bpm-line: #FFFF00;
    --tap: #FFFFFF;
    --hold: #00BFFF;
    --hold-fill: rgba(0, 191, 255, 0.3);
    --trace: #808080;
    --swap: #A020F0;
    --danger: #FF0000;
    --playhead: #FF0000;
    --select-box: rgba(0, 255, 255, 0.3);
    --select-box-border: #00FFFF;
    
    --btn-bg: #000000;
    --btn-hover: #333333;
    --btn-active: #555555;
    --btn-border-hover: #FFFFFF;
    --btn-primary-bg: #000000;
    --btn-primary-border: #00FFFF;
    --btn-primary-hover: #333333;
    --input-bg: #000000;
    --note-card-bg: #000000;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    font-size:13px;
  }

  /* -------------------------------------------------------------
     ヘッダーレイアウト（2列構成へ変更）
  ------------------------------------------------------------- */
  header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
  }

  .brand{font-family:var(--mono);font-weight:700;letter-spacing:0.08em;font-size:13px;display:flex;align-items:baseline;gap:6px;}
  .brand small{color:var(--text-dim);font-weight:400;letter-spacing:0.02em;}
  .divider{width:1px;height:22px;background:var(--panel-border);}
  
  /* アイコンフォントの調整 */
  .material-symbols-outlined {
    font-size: 16px;
    vertical-align: middle;
  }

  button {
    font-family:var(--sans);font-size:12.5px;
    background:var(--btn-bg);color:var(--text);
    border:1px solid var(--panel-border);border-radius:5px;padding:6px 11px;cursor:pointer;
    transition:background 0.12s, border-color 0.12s;
    display:flex; align-items:center; gap:4px;
  }
  button:hover:not(:disabled){background:var(--btn-hover);border-color:var(--btn-border-hover);}
  button:active:not(:disabled){background:var(--btn-active);}
  button:disabled{opacity:0.35;cursor:not-allowed;}
  button.primary{background:var(--btn-primary-bg);border-color:var(--btn-primary-border);color:var(--tap);}
  button.primary:hover:not(:disabled){background:var(--btn-primary-hover);}
  
  select,input[type=text],input[type=number]{
    font-family:var(--mono);font-size:12px;
    background:var(--input-bg);color:var(--text);
    border:1px solid var(--panel-border);border-radius:5px;padding:5px 8px;
  }

  .type-btn{border-left:3px solid transparent;font-family:var(--mono);letter-spacing:0.03em;}
  .type-btn .dot{width:8px;height:8px;border-radius:2px;}
  .type-btn.active{background:var(--btn-bg);border-color:var(--btn-border-hover);}
  .type-btn[data-type="tap"].active{border-left-color:var(--tap);}
  .type-btn[data-type="hold"].active{border-left-color:var(--hold);}
  .type-btn[data-type="trace"].active{border-left-color:var(--trace);}
  .type-btn[data-type="swap"].active{border-left-color:var(--swap);}
  .type-btn[data-type="shift"].active{border-left-color:var(--shift);}
  .type-btn[data-type="scramble"].active{border-left-color:var(--scramble);}
  .mode-btn.active{background:var(--btn-border-hover);border-color:var(--text-faint);color:var(--text);}
  
  .zoom-group{display:flex;align-items:center;gap:6px;font-family:var(--mono);color:var(--text-dim);}
  .zoom-group span{min-width:42px;text-align:center;}
  .spacer{flex:1;}
  .filename{font-family:var(--mono);color:var(--text-dim);font-size:12px;}

  /* -------------------------------------------------------------
     トランスポート・メイン領域
  ------------------------------------------------------------- */
  .transport{
    display:flex;align-items:center;gap:12px;padding:7px 16px;
    background:var(--lane-alt);border-bottom:1px solid var(--panel-border);flex-shrink:0;
  }
  .transport.disabled{opacity:0.4;}
  .transport .time{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);min-width:105px;text-align:center;}
  .transport input[type=range]{flex:1;accent-color:var(--tap);}
  .playbtn{width:34px;height:30px;justify-content:center;font-size:14px;}

  main{flex:1;display:flex;overflow:hidden;min-height:0;}
  .grid-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
  .lane-header{display:flex;flex-shrink:0;border-bottom:1px solid var(--panel-border);background:var(--panel);}
  .lane-header .ruler-cell{flex-shrink:0;}
  .lane-header .lane-cell{
    flex-shrink:0;text-align:center;padding:7px 0;font-family:var(--mono);
    color:var(--text-dim);font-size:11px;letter-spacing:0.06em;border-left:1px solid var(--panel-border);
  }
  .scroll-wrap{flex:1;overflow-y:auto;overflow-x:auto;position:relative;}
  canvas{display:block;cursor:crosshair;}

  .empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--text-dim);}
  .empty-state .glyph{font-family:var(--mono);font-size:34px;color:var(--text-faint);letter-spacing:0.1em;}
  .empty-state p{margin:0;font-size:13px;}

  aside{width:290px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--panel-border);padding:16px;overflow-y:auto;}
  aside h3{
    font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--text-dim);margin:0 0 10px 0;
    text-transform:uppercase;display:flex;align-items:center;gap:8px;
  }
  aside h3::after{content:'';flex:1;height:1px;background:var(--panel-border);}
  .stat-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;gap:8px;}
  .stat-row .k{color:var(--text-dim);flex-shrink:0;}
  .stat-row .v{font-family:var(--mono);color:var(--text);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .section{margin-bottom:22px;}
  .note-card{border:1px solid var(--panel-border);border-radius:6px;padding:12px;background:var(--note-card-bg);}
  .note-card .type-tag{
    display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:0.05em;
    padding:2px 7px;border-radius:3px;margin-bottom:8px;font-weight:700;
  }
  .placeholder{color:var(--text-faint);font-size:12.5px;line-height:1.6;}
  .del-btn{width:100%;margin-top:10px;background:var(--bg);border-color:var(--danger);color:var(--danger);}
  .del-btn:hover{background:var(--panel-border);}
  .count-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;}
  .count-item{display:flex;align-items:center;gap:6px;font-size:12px;}
  .count-item .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
  .count-item .n{font-family:var(--mono);color:var(--text-dim);margin-left:auto;}
  kbd{font-family:var(--mono);background:var(--btn-bg);border:1px solid var(--panel-border);border-radius:3px;padding:1px 5px;font-size:11px;color:var(--text-dim);}
  .hint-row{display:flex;justify-content:space-between;padding:3px 0;font-size:11.5px;color:var(--text-dim);gap:8px;}

  footer{
    flex-shrink:0;display:flex;align-items:center;gap:18px;padding:6px 16px;
    background:var(--panel);border-top:1px solid var(--panel-border);
    font-family:var(--mono);font-size:11.5px;color:var(--text-dim);
  }
  footer .sep{width:1px;height:14px;background:var(--panel-border);}
  footer .highlight{color:var(--text);}

  input[type=file]{display:none;}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--panel-border);border-radius:6px;border:3px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;
    align-items:center;justify-content:center;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    width:520px;max-height:82vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:10px;padding:22px;
  }
  .modal h2{font-family:var(--mono);font-size:14px;letter-spacing:0.06em;margin:0 0 16px 0;}
  .modal .field-group{margin-bottom:18px;}
  .modal .field-group h4{
    font-family:var(--mono);font-size:10.5px;color:var(--text-dim);text-transform:uppercase;
    letter-spacing:0.08em;margin:0 0 8px 0;
  }
  .field-row{display:flex;gap:10px;margin-bottom:8px;}
  .field-row label{
    flex:1;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text-dim);
  }
  .field-row input{width:100%;}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
</style>
</head>
<body>

<header>
  <!-- 1段目：ファイル操作・メタデータ・テーマ -->
  <div class="header-row">
    <div class="brand">RCF-1 <small>Chart Editor</small></div>
    <div class="divider"></div>
    <button id="btnLoad" title="読み込み"><span class="material-symbols-outlined">folder_open</span>読込</button>
    <input type="file" id="fileInput" accept="application/json,.json">
    <button id="btnNew" title="新規作成"><span class="material-symbols-outlined">add_box</span>新規</button>
    <button id="btnExport" class="primary" title="書き出し" disabled><span class="material-symbols-outlined">save</span>書出</button>
    <button id="btnMeta" title="メタデータ編集" disabled><span class="material-symbols-outlined">info</span>メタ</button>
    <button id="btnAudio" title="音声読み込み" disabled><span class="material-symbols-outlined">audio_file</span>音声</button>
    <input type="file" id="audioInput" accept="audio/*">
    <div class="divider"></div>
    <button id="btnUndo" title="元に戻す" disabled><span class="material-symbols-outlined">undo</span></button>
    <button id="btnRedo" title="やり直し" disabled><span class="material-symbols-outlined">redo</span></button>
    <div class="spacer"></div>
    <select id="themeSelect" title="テーマ切り替え">
      <option value="dark">ダークモード</option>
      <option value="light">ライトモード</option>
      <option value="high-contrast">高コントラスト</option>
    </select>
  </div>
  
  <!-- 2段目：モード・ノーツ種類・ズーム・スナップ -->
  <div class="header-row">
    <button class="mode-btn active" data-mode="place" id="modePlace" title="配置モード"><span class="material-symbols-outlined">edit</span></button>
    <button class="mode-btn" data-mode="select" id="modeSelect" title="選択モード"><span class="material-symbols-outlined">highlight_alt</span></button>
    <div class="divider"></div>
    <button class="type-btn active" data-type="tap"><span class="dot" style="background:var(--tap)"></span>TAP<kbd>1</kbd></button>
    <button class="type-btn" data-type="hold"><span class="dot" style="background:var(--hold)"></span>HOLD<kbd>2</kbd></button>
    <button class="type-btn" data-type="trace"><span class="dot" style="background:var(--trace)"></span>TRACE<kbd>3</kbd></button>
    <button class="type-btn" data-type="swap"><span class="dot" style="background:var(--swap)"></span>SWAP<kbd>4</kbd></button>
    <button class="type-btn" data-type="shift"><span class="dot" style="background:var(--shift)"></span>SHIFT<kbd>5</kbd></button>
    <button class="type-btn" data-type="scramble"><span class="dot" style="background:var(--scramble)"></span>SCRAMBLE<kbd>6</kbd></button>
    <div class="divider"></div>
    <label style="color:var(--text-dim);font-family:var(--mono);font-size:11.5px;display:flex;align-items:center;gap:6px;">SNAP
      <select id="snapSelect"></select>
      <label style="color:var(--text-dim);font-family:var(--mono);font-size:11.5px;display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:10px;">
        <input type="checkbox" id="swapVisualizeToggle"> SWAP VISUALIZE
      </label>
    </label>
    <div class="zoom-group">
      <button id="zoomOut" title="縮小"><span class="material-symbols-outlined">remove</span></button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn" title="拡大"><span class="material-symbols-outlined">add</span></button>
    </div>
    <div class="spacer"></div>
    <span class="filename" id="filenameLabel">未読み込み</span>
  </div>
</header>

<div class="transport disabled" id="transport">
  <button class="playbtn" id="btnPlayPause" disabled><span class="material-symbols-outlined">play_arrow</span></button>
  <span class="time" id="timeLabel">00:00 / 00:00</span>
  <input type="range" id="seekBar" min="0" max="1000" value="0" step="1" disabled>
  <span class="filename" id="audioFileLabel">音声未読み込み</span>
</div>

<main>
  <div class="grid-area" id="gridArea">
    <div class="empty-state" id="emptyState">
      <div class="glyph">RCF-1</div>
      <p>JSONファイルを読み込んでください</p>
      <button id="btnLoad2" class="primary"><span class="material-symbols-outlined">folder_open</span> JSONを読み込み</button>
    </div>
    <div class="lane-header" id="laneHeader" style="display:none;"></div>
    <div class="scroll-wrap" id="scrollWrap" style="display:none;">
      <canvas id="gridCanvas"></canvas>
    </div>
  </div>

  <aside>
    <div class="section">
      <h3>楽曲情報</h3>
      <div id="metaStats"><p class="placeholder">未読み込み</p></div>
    </div>
    <div class="section">
      <h3>ノーツ数</h3>
      <div id="noteCounts" class="count-grid"></div>
    </div>
    <div class="section">
      <h3>選択中</h3>
      <div id="inspector"><p class="placeholder">ノーツをクリックして選択</p></div>
    </div>
    <div class="section">
      <h3 id="hintTitle">操作（配置モード）</h3>
      <div id="hintBody"></div>
    </div>
  </aside>
</main>

<footer>
  <span>Tick: <span class="highlight" id="statTick">-</span></span>
  <div class="sep"></div>
  <span>Beat: <span class="highlight" id="statBeat">-</span></span>
  <div class="sep"></div>
  <span>Lane: <span class="highlight" id="statLane">-</span></span>
  <div class="sep"></div>
  <span>Notes: <span class="highlight" id="statCount">0</span></span>
  <div class="sep"></div>
  <span>Length: <span class="highlight" id="statLength">-</span> ticks</span>
</footer>

<!-- Metadata modal (不要になったフィールドを削除) -->
<div class="modal-overlay" id="metaModalOverlay">
  <div class="modal">
    <h2>メタデータ編集</h2>

    <div class="field-group">
      <h4>基本情報</h4>
      <div class="field-row">
        <label>楽曲ID<input type="text" id="m_id"></label>
        <label>タイトル<input type="text" id="m_title"></label>
      </div>
      <div class="field-row">
        <label>アーティスト<input type="text" id="m_artist"></label>
        <label>譜面制作者<input type="text" id="m_charter"></label>
      </div>
    </div>

    <div class="field-group">
      <h4>難易度</h4>
      <div class="field-row">
        <label>難易度名<input type="text" id="m_diffName"></label>
        <label>難易度数値<input type="number" id="m_diffLevel"></label>
      </div>
    </div>

    <div class="field-group">
      <h4>音声 / ジャケット</h4>
      <div class="field-row">
        <label>音声ファイル名<input type="text" id="m_audioFile"></label>
        <label>オフセット (ms)<input type="number" id="m_audioOffset"></label>
      </div>
      <div class="field-row">
        <label>ジャケットファイル名<input type="text" id="m_jacketFile"></label>
      </div>
    </div>

    <div class="field-group">
      <h4>構成</h4>
      <div class="field-row">
        <label>レーン数<input type="number" id="m_laneCount"></label>
        <label>解像度 (Tick/拍)<input type="number" id="m_resolution"></label>
      </div>
    </div>

    <div class="actions">
      <button id="metaCancel">キャンセル</button>
      <button id="metaSave" class="primary">保存</button>
    </div>
  </div>
</div>


<div class="modal-overlay" id="convertModalOverlay">
  <div class="modal">
    <h2>フォーマット変換</h2>
    <p>読み込まれた譜面は古いフォーマット（6レーン以下）です。<br>新しいフォーマット（7レーン：SPACEレーン追加）に変換しますか？</p>
    <div class="actions">
      <button id="convertCancel">キャンセル（そのまま開く）</button>
      <button id="convertAccept" class="primary">変換する</button>
    </div>
  </div>
</div>

<audio id="audioEl"></audio>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // Constants
  // ---------------------------------------------------------------
  const RULER_W = 74;
  const LANE_W = 62;
  const BASE_PX_PER_TICK = 90/960;
  const NOTE_H = 14;
  const MIN_HOLD_LEN_UNITS = 1;
  const HISTORY_LIMIT = 100;
  const MIN_ZOOM = 0.25, MAX_ZOOM = 4;

  const TYPE_META = {
    tap:   { color: getVar('--tap'),   label:'TAP',   hasEnd:false },
    hold:  { color: getVar('--hold'),  label:'HOLD',  hasEnd:true  },
    trace: { color: getVar('--trace'), label:'TRACE', hasEnd:false },
    swap:  { color: getVar('--swap'),  label:'SWAP',  hasEnd:false },
    shift:    { color: getVar('--shift'),    label:'SHIFT',    hasEnd:true  },
    scramble: { color: getVar('--scramble'), label:'SCRAMBLE', hasEnd:false },
  };
  function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  const SNAP_OPTIONS = [
    {n:4,  label:'4分'}, {n:8,  label:'8分'}, {n:12, label:'12分(3連)'}, {n:16, label:'16分'},
    {n:24, label:'24分(3連)'}, {n:32, label:'32分'}, {n:48, label:'48分(3連)'}, {n:64, label:'64分'},
  ];

  const HINTS = {
    place: [
      ['配置', '空セルをクリック'],

  // ---------------------------------------------------------------
  // State
  // ---------------------------------------------------------------
  let chart = null;

  let isSwapVisualizeMode = false;
  let laneStateHistory = [];

  function rebuildLaneStates() {
    laneStateHistory = [];
    let currentV = [0, 1, 2, 3, 4, 5, 6]; 
    let currentR = [0, 1, 2, 3, 4, 5, 6];
    laneStateHistory.push({ tick: -1, V: [...currentV], R: [...currentR] });
    if (!chart || !chart.notes) return;
    
    const mutators = chart.notes.filter(n => n.type === 'swap' || n.type === 'scramble').sort((a,b) => a.tick - b.tick);
    
    for (const m of mutators) {
      let V = [...currentV];
      let R = [...currentR];
      
      if (m.type === 'scramble') {
        const swap = (i, j) => {
          const temp = V[i]; V[i] = V[j]; V[j] = temp;
          R[V[i]] = i; R[V[j]] = j;
        };
        swap(0, 5); swap(1, 4); swap(2, 3);
      } else if (m.type === 'swap') {
        const swap = (i, j) => {
          const temp = V[i]; V[i] = V[j]; V[j] = temp;
          R[V[i]] = i; R[V[j]] = j;
        };
        if (m.lane === 0) swap(1, 2);
        else if (m.lane === 5) swap(3, 4);
        else if (m.lane === 6) swap(2, 3);
      }
      
      currentV = V; currentR = R;
      laneStateHistory.push({ tick: m.tick, V, R });
    }
  }

  function getLaneMapping(tick) {
    for (let i = laneStateHistory.length - 1; i >= 0; i--) {
      if (laneStateHistory[i].tick < tick) return laneStateHistory[i];
    }
    return laneStateHistory[0];
  }

  function getVisualLane(n, targetTick) {
    if (!isSwapVisualizeMode) return n.lane;
    if (n.lane === 6) return n.lane;
    if (n.type === 'hold' || n.type === 'shift') return n.lane;
    return getLaneMapping(targetTick).V[n.lane];
  }

  function getInternalLaneForNewNote(visualLane, type, targetTick) {
    if (!isSwapVisualizeMode) return visualLane;
    if (visualLane === 6) return visualLane;
    if (type === 'hold' || type === 'shift') return visualLane;
    return getLaneMapping(targetTick).R[visualLane];
  }

    else if(e.key==='Delete' || e.key==='Backspace'){

  function setZoom(z, opts){
    const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
    if(opts && opts.anchorTick!=null && opts.anchorScreenY!=null){
      zoom = newZoom;
      el.zoomLabel.textContent = Math.round(zoom*100)+'%';
      if(chart){ resizeCanvas(); draw(); el.scrollWrap.scrollTop = tickToY(opts.anchorTick) - opts.anchorScreenY; }
      return;
    }
    zoom = newZoom;
    el.zoomLabel.textContent = Math.round(zoom*100)+'%';
    if(chart){ resizeCanvas(); draw(); }
  }

  el.scrollWrap.addEventListener('wheel', (e)=>{

      const screenY = e.clientY - rect.top;
      const scrollY = screenY + el.scrollWrap.scrollTop;
      const tickUnderCursor = yToTick(scrollY);
      const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
      setZoom(zoom*factor, {anchorTick:tickUnderCursor, anchorScreenY:screenY});
    }
  }, {passive:false});

  async function openChartFile(){

      const text = await file.text();

      loadChart(JSON.parse(text), file.name);
    } catch(err) {
      if (err.name !== 'AbortError') alert('ファイルの読み込みに失敗しました: ' + err.message);
    }
  }

  function onFileChosen(e){

      catch(err){ alert('JSONの読み込みに失敗しました: '+err.message); }

  function askConvertFormat() {
    return new Promise(resolve => {
      const overlay = document.getElementById('convertModalOverlay');
      const acceptBtn = document.getElementById('convertAccept');
      const cancelBtn = document.getElementById('convertCancel');
      
      overlay.classList.add('open');
      
      function cleanup() {
        acceptBtn.removeEventListener('click', onAccept);
        cancelBtn.removeEventListener('click', onCancel);
        overlay.classList.remove('open');
      }
      function onAccept() { cleanup(); resolve(true); }
      function onCancel() { cleanup(); resolve(false); }
      
      acceptBtn.addEventListener('click', onAccept);
      cancelBtn.addEventListener('click', onCancel);
    });
  }

  async function loadChart(data, name){
    if(!data || typeof data !== 'object'){ alert('不正なJSONです'); return; }
    if(!Array.isArray(data.notes)) data.notes = [];
    if(!data.metadata) data.metadata = {};
    if(!data.timing) data.timing = {bpms:[{tick:0,bpm:120}], scrolls:[], timeSignatures:[{tick:0,numerator:4,denominator:4}], stops:[]};
    if(!data.metadata.audio) data.metadata.audio = {file:'', offset:0};
    if(!data.metadata.jacket) data.metadata.jacket = {file:''};
    if(!data.metadata.difficulty) data.metadata.difficulty = {name:'Low', level:1};

    let incomingLaneCount = data.metadata.laneCount || 6;
    if (incomingLaneCount < 7) {
      const doConvert = await askConvertFormat();
      if (doConvert) {
        data.metadata.laneCount = 7;
        incomingLaneCount = 7;
      }
    }

    chart = data;
    filename = name || 'chart.json';
    laneCount = incomingLaneCount;
    resolution = chart.metadata.resolution || 960;

    if (audioObjectUrl) {
      URL.revokeObjectURL(audioObjectUrl);
      audioObjectUrl = null;
    }
    audio.removeAttribute('src');
    audio.load();
    el.audioFileLabel.textContent = '音声未読み込み';
    el.transport.classList.add('disabled');
    el.btnPlayPause.disabled = true;
    el.seekBar.disabled = true;

    stopRaf();
    el.timeLabel.textContent = '00:00 / 00:00';

  // ---------------------------------------------------------------
  // Coordinate helpers
  // ---------------------------------------------------------------
  function pxPerTick(){ return BASE_PX_PER_TICK * zoom; }
  function tickToY(tick){ return tick * pxPerTick(); }
  function yToTick(y){ return y / pxPerTick(); }
  function laneToX(lane){ return RULER_W + lane*LANE_W; }
  function xToLane(x){ const raw = Math.floor((x - RULER_W) / LANE_W); return Math.max(0, Math.min(laneCount-1, raw)); }
  function snapTicks(){ return resolution*4/snapN; }
  function snapTick(tick){ const s = snapTicks(); return Math.max(0, Math.round(tick/s)*s); }
  function clampLane(l){ return Math.max(0, Math.min(laneCount-1, l)); }

  // オーディオ要素自体の長さを参照するように変更したよ
  function audioDurationSec(){
    if(audio && isFinite(audio.duration) && audio.duration>0){
      return audio.duration;
    }
    return 0;
  }

  function maxContentTick(){
    let m = 0;
    
    // 既存のノーツやタイミングイベントから最大Tickを取得
    (chart.notes||[]).forEach(n=>{ m = Math.max(m, n.tick||0, n.endTick||0); });
    (chart.timing.bpms||[]).forEach(b=>m=Math.max(m,b.tick||0));
    (chart.timing.timeSignatures||[]).forEach(t=>m=Math.max(m,t.tick||0));

    // 音声が読み込まれている場合は、曲の総尺そのものから最大Tickを算出してキャンバスを伸ばす
    const durationSec = audioDurationSec();
    if (durationSec > 0) {
      const audioMaxTick = secondsToTick(durationSec);
      m = Math.max(m, audioMaxTick);
    }

    // 音声がなくても常に最後尾からさらに20小節分の余白（キャンバス領域）を確保する
    // これにより、音声未読み込み状態でもスクロールして無限にノーツを配置し続けられる
    return m + (resolution * 4 * 20);
  }
  function contentHeight(){ return tickToY(maxContentTick()); }
  function contentWidth(){ return RULER_W + laneCount*LANE_W; }

  function resizeCanvas(){
    const w = contentWidth();
    const h = Math.max(400, contentHeight());
    const dpr = window.devicePixelRatio || 1;
    el.gridCanvas.style.width = w+'px';
    el.gridCanvas.style.height = h+'px';
    el.gridCanvas.width = Math.round(w*dpr);
    el.gridCanvas.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  // ---------------------------------------------------------------
  // Tick <-> time (seconds) conversion, using BPM segments
  // ---------------------------------------------------------------
  function sortedBpms(){ return (chart.timing.bpms||[{tick:0,bpm:120}]).slice().sort((a,b)=>a.tick-b.tick); }

  function tickToSeconds(targetTick){
    const bpms = sortedBpms();
    if(bpms.length===0 || bpms[0].tick!==0) bpms.unshift({tick:0,bpm:120});
    let t = 0, prevTick = 0, prevBpm = bpms[0].bpm;
    for(let i=1;i<bpms.length;i++){
      const segEnd = bpms[i].tick;
      if(targetTick <= segEnd){
        t += (targetTick-prevTick) * (60/(prevBpm*resolution));
        return t;
      }
      t += (segEnd-prevTick) * (60/(prevBpm*resolution));
      prevTick = segEnd; prevBpm = bpms[i].bpm;
    }
    t += (targetTick-prevTick) * (60/(prevBpm*resolution));
    return t;
  }

  function secondsToTick(targetSec){
    const bpms = sortedBpms();
    if(bpms.length===0 || bpms[0].tick!==0) bpms.unshift({tick:0,bpm:120});
    let t = 0, prevTick = 0, prevBpm = bpms[0].bpm;
    for(let i=1;i<bpms.length;i++){
      const segEnd = bpms[i].tick;
      const segDur = (segEnd-prevTick) * (60/(prevBpm*resolution));
      if(t+segDur >= targetSec){
        return prevTick + (targetSec-t) * (prevBpm*resolution/60);
      }
      t += segDur; prevTick = segEnd; prevBpm = bpms[i].bpm;
    }
    return prevTick + (targetSec-t) * (prevBpm*resolution/60);
  }

  function audioOffsetSec(){ return ((chart.metadata.audio && chart.metadata.audio.offset) || 0)/1000; }
  function audioTimeForTick(tick){ return tickToSeconds(tick) + audioOffsetSec(); }
  function tickForAudioTime(sec){ return secondsToTick(sec - audioOffsetSec()); }

  // ---------------------------------------------------------------
  // Grid / bpm drawing
  // ---------------------------------------------------------------
  function ticksPerBeatAt(numerator, denominator){ return resolution * (4/denominator); }

  function drawGridLines(maxTick){
    const ts = (chart.timing.timeSignatures||[{tick:0,numerator:4,denominator:4}]).slice().sort((a,b)=>a.tick-b.tick);
    if(ts.length===0) ts.push({tick:0,numerator:4,denominator:4});
    const w = contentWidth();

    for(let i=0;i<ts.length;i++){
      const segStart = ts[i].tick;
      const segEnd = (i+1<ts.length) ? ts[i+1].tick : maxTick;
      const beatTicks = ticksPerBeatAt(ts[i].numerator, ts[i].denominator);
      const measureTicks = beatTicks * ts[i].numerator;
      if(measureTicks<=0) continue;

      ctx.strokeStyle = getVar('--grid-beat');
      ctx.lineWidth = 1;
      for(let t=segStart; t<segEnd; t+=beatTicks){
        const y = Math.round(tickToY(t))+0.5;
        ctx.beginPath(); ctx.moveTo(RULER_W,y); ctx.lineTo(w,y); ctx.stroke();
      }
      ctx.strokeStyle = getVar('--grid-measure');
      ctx.fillStyle = getVar('--text-faint');
      ctx.font = '10px '+getVar('--mono');
      let measureNo = 1;
      for(let t=segStart; t<segEnd; t+=measureTicks){
        const y = Math.round(tickToY(t))+0.5;
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(RULER_W,y); ctx.lineTo(w,y); ctx.stroke();
        ctx.fillText(String(measureNo), 8, y+3);
        measureNo++;
      }
    }

    ctx.strokeStyle = getVar('--panel-border');
    ctx.lineWidth = 1;
    for(let i=0;i<=laneCount;i++){
      const x = Math.round(laneToX(i))+0.5;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, tickToY(maxTick)); ctx.stroke();
    }
    const rx = Math.round(RULER_W)+0.5;
    ctx.beginPath(); ctx.moveTo(rx,0); ctx.lineTo(rx, tickToY(maxTick)); ctx.stroke();
  }

  function drawBpmLines(maxTick){
    const w = contentWidth();
    const bpms = sortedBpms();
    ctx.font = '10px '+getVar('--mono');
    bpms.forEach(b=>{
      const y = tickToY(b.tick);
      ctx.strokeStyle = getVar('--bpm-line');
      ctx.setLineDash([4,3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(RULER_W,Math.round(y)+0.5); ctx.lineTo(w,Math.round(y)+0.5); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = getVar('--bpm-line');
      ctx.fillText('♩='+b.bpm, RULER_W+4, y>10? y-4 : y+12);
    });
  }

  // ---------------------------------------------------------------
  // Note drawing
  // ---------------------------------------------------------------
  function noteColor(type){ return (TYPE_META[type]||{}).color || '#888'; }

  function drawNote(n){
    const visualLane = getVisualLane(n, n.tick);
    const x = laneToX(visualLane);
    const drawWidth = LANE_W;
    const y = tickToY(n.tick);
    const cx = x + drawWidth/2;
    const isSelected = selectedIds.has(n.id);
    const color = noteColor(n.type);

    if(n.type==='hold' || n.type==='shift'){
      const y2 = tickToY(n.endTick!=null ? n.endTick : n.tick);
      ctx.fillStyle = n.type==='shift' ? color.replace(')', ', 0.3)').replace('rgb', 'rgba') : getVar('--hold-fill');
      if(n.type==='shift' && color.startsWith('#')) ctx.fillStyle = color + '4D';
      ctx.fillRect(x+6, y, drawWidth-12, Math.max(2,y2-y));
      ctx.strokeStyle = color;
      ctx.lineWidth = isSelected? 3:2;
      ctx.strokeRect(x+6, y, drawWidth-12, Math.max(2,y2-y));
      ctx.fillStyle = color;
      ctx.fillRect(x+6, y2-3, drawWidth-12, 3);
    }

    ctx.fillStyle = (n.type==='trace') ? 'rgba(0,0,0,0)' : color;
    ctx.strokeStyle = color;
    ctx.lineWidth = isSelected ? 3 : 2;

    if(n.type==='trace'){
      ctx.beginPath();
      ctx.moveTo(cx, y-NOTE_H/2);
      ctx.lineTo(cx+drawWidth/2-8, y);
      ctx.lineTo(cx, y+NOTE_H/2);
      ctx.lineTo(cx-drawWidth/2+8, y);
      ctx.closePath();
      ctx.stroke();
    } else if(n.type==='scramble'){
      ctx.beginPath();
      ctx.moveTo(cx, Math.round(y)-NOTE_H/2);
      ctx.lineTo(cx+NOTE_H, Math.round(y)+NOTE_H/2);
      ctx.lineTo(cx-NOTE_H, Math.round(y)+NOTE_H/2);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 145, 0, 0.25)';
      ctx.fill();
      ctx.stroke();
    } else if(n.type==='swap'){
      ctx.beginPath();
      ctx.arc(cx, y, NOTE_H/2, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,92,138,0.25)'; // 透明度が必要なため固定値だが、CSS変数を使ってもOK
      ctx.fill();
      ctx.stroke();
    } else {
      const rw = drawWidth-16, rh = NOTE_H;
      roundRect(ctx, cx-rw/2, y-rh/2, rw, rh, 3);
      ctx.fillStyle = color;
      ctx.fill();
    }

    if(isSelected){
      ctx.strokeStyle = getVar('--text'); // 白あるいはテキスト色
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(cx, y, NOTE_H/2+5, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  // ---------------------------------------------------------------
  // Main draw
  // ---------------------------------------------------------------
  let hoverPos = null;

  function draw(){
    rebuildLaneStates();
    if(!chart) return;
    const w = contentWidth();
    const maxTick = maxContentTick();
    const h = tickToY(maxTick);

    ctx.clearRect(0,0,w,Math.max(h,400));
    for(let i=0;i<laneCount;i++){
      if(i%2===1){ ctx.fillStyle = getVar('--lane-alt'); ctx.fillRect(laneToX(i),0,LANE_W,h); }
    }

    drawGridLines(maxTick);
    drawBpmLines(maxTick);

    const notes = chart.notes||[];
    notes.filter(n=>n.type==='hold' || n.type==='shift').forEach(drawNote);
    notes.filter(n=>n.type!=='hold' && n.type!=='shift').forEach(drawNote);

    if(drag && drag.mode==='create-hold'){
      ctx.globalAlpha = 0.6;
      drawNote({type:drag.type || 'hold', lane:drag.lane, tick:drag.startTick, endTick:drag.currentTick, id:-999});
      ctx.globalAlpha = 1;
    }

    if(drag && drag.mode==='rect-select'){
      const x0=Math.min(drag.x0,drag.x1), x1=Math.max(drag.x0,drag.x1);
      const y0=Math.min(drag.y0,drag.y1), y1=Math.max(drag.y0,drag.y1);
      ctx.fillStyle = getVar('--select-box');
      ctx.strokeStyle = getVar('--select-box-border');
      ctx.lineWidth = 1;
      ctx.fillRect(x0,y0,x1-x0,y1-y0);
      ctx.strokeRect(x0,y0,x1-x0,y1-y0);
    }

    if(hoverPos){
      const y = tickToY(hoverPos.snappedTick);
      ctx.strokeStyle = getVar('--text-dim');
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(RULER_W, Math.round(y)+0.5); ctx.lineTo(w,Math.round(y)+0.5); ctx.stroke();
      ctx.fillStyle = getVar('--select-box');
      const hWidth = LANE_W;
      const hX = laneToX(hoverPos.lane);
      ctx.fillRect(hX, y-NOTE_H/2-2, hWidth, NOTE_H+4);
    }

    if(audio.src){
      const curTick = tickForAudioTime(audio.currentTime||0);
      const py = tickToY(curTick);
      ctx.strokeStyle = getVar('--playhead');
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, Math.round(py)+0.5); ctx.lineTo(w, Math.round(py)+0.5); ctx.stroke();
      ctx.fillStyle = getVar('--playhead');
      ctx.beginPath();
      ctx.moveTo(0,py-6); ctx.lineTo(10,py); ctx.lineTo(0,py+6); ctx.closePath(); ctx.fill();
    }
  }

  // ---------------------------------------------------------------
  // Hit testing / sorted order
  // ---------------------------------------------------------------
  function sortedNotes(){
    return (chart.notes||[]).slice().sort((a,b)=>{
      if(a.tick!==b.tick) return a.tick-b.tick;
      if(a.lane!==b.lane) return a.lane-b.lane;
      return a.id-b.id;
    });
  }

  function hitTest(x,y){
    const hitTick = yToTick(y);
    const notes = chart.notes||[];
    for(let i=notes.length-1;i>=0;i--){
      const n = notes[i];
      if(n.type==='hold' || n.type==='shift'){
        const y1 = tickToY(n.tick), y2 = tickToY(n.endTick!=null?n.endTick:n.tick);
        if(y>=y1-NOTE_H/2 && y<=y2+NOTE_H/2){
          const visLane = getVisualLane(n, hitTick);
          const cx = laneToX(visLane) + LANE_W/2;
          if(Math.abs(x-cx) <= LANE_W/2-4){
            const nearEnd = Math.abs(y-y2) <= 7;
            return {note:n, zone: nearEnd?'end':'body'};
          }
        }
      } else {
        const ny = tickToY(n.tick);
        if(Math.abs(y-ny) <= NOTE_H/2+3){
          const visLane = getVisualLane(n, n.tick);
          const cx = laneToX(visLane) + LANE_W/2;
          if(Math.abs(x-cx) <= LANE_W/2-4){
            return {note:n, zone:'body'};
          }
        }
      }
    }
    return null;
  }

  function noteBounds(n){
    const visLane = getVisualLane(n, n.tick);
    const drawWidth = LANE_W;
    const x = laneToX(visLane);
    const x0 = x+6, x1 = x+drawWidth-6;
    let y0,y1;
    if(n.type==='hold' || n.type==='shift'){ y0=tickToY(n.tick)-NOTE_H/2; y1=tickToY(n.endTick!=null?n.endTick:n.tick)+NOTE_H/2; }
    else { y0=tickToY(n.tick)-NOTE_H/2; y1=tickToY(n.tick)+NOTE_H/2; }
    return {x0,x1,y0,y1};
  }
  function rectsIntersect(a,b){ return a.x0<=b.x1 && a.x1>=b.x0 && a.y0<=b.y1 && a.y1>=b.y0; }

  // ---------------------------------------------------------------
  // Selection helpers
  // ---------------------------------------------------------------
  function clearSelection(){ selectedIds.clear(); lastClickedId=null; }
  function selectOnly(id){ selectedIds.clear(); selectedIds.add(id); lastClickedId=id; }
  function toggleSelect(id){
    if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    lastClickedId = id;
  }
  function selectRange(id){
    const order = sortedNotes().map(n=>n.id);
    const anchor = lastClickedId!=null ? order.indexOf(lastClickedId) : order.indexOf(id);
    const target = order.indexOf(id);
    const lo = Math.min(anchor,target), hi = Math.max(anchor,target);
    selectedIds.clear();
    for(let i=lo;i<=hi;i++) selectedIds.add(order[i]);
    lastClickedId = id;
  }
  function selectSameType(type){
    selectedIds.clear();
    (chart.notes||[]).forEach(n=>{ if(n.type===type) selectedIds.add(n.id); });
  }

  // ---------------------------------------------------------------
  // History (undo/redo)
  // ---------------------------------------------------------------
  function pushHistory(){
    history.push(JSON.stringify(chart.notes));
    if(history.length>HISTORY_LIMIT) history.shift();
    redoStack = [];
    updateHistoryButtons();
  }
  function undo(){
    if(history.length===0) return;
    redoStack.push(JSON.stringify(chart.notes));
    chart.notes = JSON.parse(history.pop());
    clearSelection();
    drag = null;
    resizeCanvas(); draw(); updateNoteCounts(); updateInspector(); updateFooterCounts();
    updateHistoryButtons();
  }
  function redo(){
    if(redoStack.length===0) return;
    history.push(JSON.stringify(chart.notes));
    chart.notes = JSON.parse(redoStack.pop());
    clearSelection();
    drag = null;
    resizeCanvas(); draw(); updateNoteCounts(); updateInspector(); updateFooterCounts();
    updateHistoryButtons();
  }
  function updateHistoryButtons(){
    el.btnUndo.disabled = history.length===0;
    el.btnRedo.disabled = redoStack.length===0;
  }

  // ---------------------------------------------------------------
  // Note mutation
  // ---------------------------------------------------------------
  function nextId(){ let m=0; (chart.notes||[]).forEach(n=>{ if(n.id>m) m=n.id; }); return m+1; }

  // flagsは使わなくなったから削除しておいたよ
  function placeNote(type, tick, lane){
    if (type === 'swap' && ![0, 5, 6].includes(lane)) return null;
    if (lane === 6 && !['swap', 'scramble', 'hold', 'shift'].includes(type)) return null;
    if (type === 'scramble' && lane !== 6) return null;
    pushHistory();
    const n = { id: nextId(), tick, lane, type, size:1 };
    if(type==='hold' || type==='shift'){ n.endTick = tick + snapTicks()*MIN_HOLD_LEN_UNITS; }
    chart.notes.push(n);
    selectOnly(n.id);
    resizeCanvas(); draw(); updateNoteCounts(); updateInspector(); updateFooterCounts();
    return n;
  }

  function deleteNoteById(id){
    pushHistory();
    chart.notes = chart.notes.filter(n=>n.id!==id);
    selectedIds.delete(id);
    resizeCanvas(); draw(); updateNoteCounts(); updateInspector(); updateFooterCounts();
  }

  function deleteSelected(){
    if(selectedIds.size===0) return;
    pushHistory();
    chart.notes = chart.notes.filter(n=>!selectedIds.has(n.id));
    clearSelection();
    resizeCanvas(); draw(); updateNoteCounts(); updateInspector(); updateFooterCounts();
  }

  // ---------------------------------------------------------------
  // Mouse interaction
  // ---------------------------------------------------------------
  el.gridCanvas.addEventListener('contextmenu', (e)=>{
    e.preventDefault();
    const hit = hitTest(e.offsetX, e.offsetY);
    if(hit) deleteNoteById(hit.note.id);
  });

  el.gridCanvas.addEventListener('mousedown', (e)=>{
    if(e.button!==0) return;
    const x=e.offsetX, y=e.offsetY;

    if(x < RULER_W){
      if(audio.src){
        const t = yToTick(y);
        audio.currentTime = Math.max(0, audioTimeForTick(t));
        draw();
      }
      return;
    }

    const hit = hitTest(x,y);

    if(pointerMode==='select'){
      if(hit){
        if(e.altKey){ selectSameType(hit.note.type); lastClickedId=hit.note.id; }
        else if(e.shiftKey){ selectRange(hit.note.id); }
        else if(e.ctrlKey || e.metaKey){ toggleSelect(hit.note.id); }
        else {
          if(!selectedIds.has(hit.note.id)) selectOnly(hit.note.id);
          if(hit.note.type==='hold' && hit.zone==='end' && selectedIds.size<=1){
            drag = {mode:'resize-hold', note:hit.note, snapshotTaken:false};
          } else {
            beginGroupDrag(x,y,hit.note);
          }
        }
        updateInspector(); draw();
        return;
      } else {
        if(!(e.shiftKey||e.ctrlKey||e.metaKey)) clearSelection();
        drag = {mode:'rect-select', x0:x,y0:y,x1:x,y1:y, additive:(e.shiftKey||e.ctrlKey||e.metaKey)};
        updateInspector(); draw();
        return;
      }
    } else {
      // placement mode
      if(hit){
        selectOnly(hit.note.id);
        updateInspector();
        if((hit.note.type==='hold' || hit.note.type==='shift') && hit.zone==='end'){
          drag = {mode:'resize-hold', note:hit.note, snapshotTaken:false};
        } else {
          beginGroupDrag(x,y,hit.note);
        }
        draw();
        return;
      }
      const rawLane = xToLane(x);
      const tick = snapTick(yToTick(y));
      const lane = getInternalLaneForNewNote(rawLane, selectedType, tick);
      if (selectedType === 'swap' && ![0, 5, 6].includes(lane)) return;
      if (lane === 6 && !['swap', 'scramble', 'hold', 'shift'].includes(selectedType)) return;
      if (selectedType === 'scramble' && lane !== 6) return;
      if(selectedType==='hold' || selectedType==='shift'){
        drag = { mode:'create-hold', type: selectedType, lane, startTick:tick, currentTick:tick+snapTicks() };
        draw();
      } else {
        placeNote(selectedType, tick, lane);
      }
    }
  });

  function beginGroupDrag(x,y,grabNote){
    const items = new Map();
    selectedIds.forEach(id=>{
      const n = chart.notes.find(n=>n.id===id);
      if(n) items.set(id, {tick:n.tick, lane:n.lane, rawLane: getVisualLane(n, n.tick), endTick:n.endTick});
    });
    drag = {
      mode:'group-move', snapshotTaken:false,
      grabStartTick: grabNote.tick, grabStartLane: grabNote.lane, grabRawLane: getVisualLane(grabNote, grabNote.tick),
      items
    };
  }

  window.addEventListener('mousemove', (e)=>{
    if(!chart) return;
    const rect = el.gridCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const withinX = x>=0 && x<=rect.width;
    const withinY = y>=0 && y<=rect.height;

    if(withinX && withinY){
      const rawLane = xToLane(x);
      const rawTick = yToTick(y);
      const snapped = snapTick(rawTick);
      const internalLane = getInternalLaneForNewNote(rawLane, selectedType, snapped);

      hoverPos = {x,y,lane:rawLane,snappedTick:snapped};
      el.statTick.textContent = Math.round(rawTick);
      el.statBeat.textContent = (rawTick/resolution).toFixed(2);
      el.statLane.textContent = isSwapVisualizeMode ? `${internalLane} (Vis: ${rawLane})` : rawLane;
    } else {
      hoverPos = null;
    }

    if(drag){
      if(drag.mode==='rect-select'){
        drag.x1 = x; drag.y1 = y;
        draw();
        return;
      }
      if(!drag.snapshotTaken && drag.mode!=='create-hold'){ pushHistory(); drag.snapshotTaken=true; }
      const lane = xToLane(x);
      const tick = snapTick(yToTick(y));

      if(drag.mode==='create-hold'){
        drag.currentTick = Math.max(drag.startTick+snapTicks(), tick);
      } else if(drag.mode==='resize-hold'){
        drag.note.endTick = Math.max(drag.note.tick+snapTicks(), tick);
      } else if(drag.mode==='group-move'){
        const currentRawLane = xToLane(x);
        const startRawLane = drag.grabRawLane !== undefined ? drag.grabRawLane : currentRawLane; 
        const deltaLane = currentRawLane - startRawLane;
        const deltaTick = tick - drag.grabStartTick;

        drag.items.forEach((orig,id)=>{
          const n = chart.notes.find(n=>n.id===id);
          if(!n) return;
          n.tick = Math.max(0, orig.tick+deltaTick);
          
          let targetRawLane = clampLane(orig.rawLane + deltaLane);
          let targetLane = getInternalLaneForNewNote(targetRawLane, n.type, n.tick);

          if (n.type === 'scramble') {
            targetLane = 6;
          } else if (n.type === 'swap') {
            if (![0, 5, 6].includes(targetLane)) {
              targetLane = [0, 5, 6].reduce((prev, curr) => Math.abs(curr - targetLane) < Math.abs(prev - targetLane) ? curr : prev);
            }
          } else {
            if (targetLane === 6) targetLane = 5;
          }
          n.lane = targetLane;
          if((n.type==='hold' || n.type==='shift') && orig.endTick!=null){
            n.endTick = n.tick + (orig.endTick-orig.tick);
          }
        });
      }
      resizeCanvas();
      draw();
    } else {
      draw();
    }
  });

  window.addEventListener('mouseup', ()=>{
    if(!drag) return;
    if(drag.mode==='create-hold'){
      const len = Math.max(snapTicks()*MIN_HOLD_LEN_UNITS, drag.currentTick-drag.startTick);
      pushHistory();
      // ここのノーツ作成時もflagsを削除してるよ
      const n = { id: nextId(), tick:drag.startTick, endTick:drag.startTick+len, lane:drag.lane, type:drag.type || 'hold', size:1 };
      chart.notes.push(n);
      selectOnly(n.id);
      updateNoteCounts(); updateInspector(); updateFooterCounts();
    } else if(drag.mode==='rect-select'){
      const x0=Math.min(drag.x0,drag.x1), x1=Math.max(drag.x0,drag.x1);
      const y0=Math.min(drag.y0,drag.y1), y1=Math.max(drag.y0,drag.y1);
      const rect = {x0,x1,y0,y1};
      if(!drag.additive) clearSelection();
      (chart.notes||[]).forEach(n=>{
        if(rectsIntersect(noteBounds(n), rect)) selectedIds.add(n.id);
      });
      updateInspector();
    }
    drag = null;
    resizeCanvas();
    draw();
  });

  el.scrollWrap.addEventListener('mouseleave', ()=>{ hoverPos=null; draw(); });

  // ---------------------------------------------------------------
  // Inspector / side panel rendering
  // ---------------------------------------------------------------
  function updateMetaStats(){
    const m = chart.metadata||{};
    const bpms = sortedBpms();
    const bpmRange = bpms.length ? [...new Set(bpms.map(b=>b.bpm))].join(' → ') : '-';
    el.metaStats.innerHTML = `
      <div class="stat-row"><span class="k">タイトル</span><span class="v">${escapeHtml(m.title||'-')}</span></div>
      <div class="stat-row"><span class="k">アーティスト</span><span class="v">${escapeHtml(m.artist||'-')}</span></div>
      <div class="stat-row"><span class="k">難易度</span><span class="v">${escapeHtml((m.difficulty&&m.difficulty.name)||'-')} ${m.difficulty?m.difficulty.level:''}</span></div>
      <div class="stat-row"><span class="k">レーン数</span><span class="v">${laneCount}</span></div>
      <div class="stat-row"><span class="k">解像度</span><span class="v">${resolution}</span></div>
      <div class="stat-row"><span class="k">BPM</span><span class="v">${escapeHtml(bpmRange)}</span></div>
      <div class="stat-row"><span class="k">音声ファイル</span><span class="v">${escapeHtml((m.audio&&m.audio.file)||'-')}</span></div>
    `;
  }

  function updateNoteCounts(){
    const notes = chart.notes||[];
    const counts = {tap:0,hold:0,trace:0,swap:0,shift:0,scramble:0};
    notes.forEach(n=>{ if(counts[n.type]!=null) counts[n.type]++; });
    el.noteCounts.innerHTML = Object.keys(TYPE_META).map(t=>`
      <div class="count-item"><span class="sw" style="background:${TYPE_META[t].color}"></span>${TYPE_META[t].label}<span class="n">${counts[t]}</span></div>
    `).join('');
  }

  function updateFooterCounts(){
    const notes = chart.notes||[];
    el.statCount.textContent = notes.length;
    el.statLength.textContent = maxContentTick()>0 ? Math.max(0, maxContentTick()-resolution*4*2) : 0;
  }

  function updateInspector(){
    if(selectedIds.size===0){
      el.inspector.innerHTML = '<p class="placeholder">ノーツをクリックして選択</p>';
      return;
    }
    if(selectedIds.size>1){
      el.inspector.innerHTML = `
        <div class="note-card">
          <div class="stat-row"><span class="k">選択中</span><span class="v">${selectedIds.size} 件</span></div>
          <button class="del-btn" id="inspDeleteMulti">選択したノーツを削除</button>
        </div>`;
      document.getElementById('inspDeleteMulti').addEventListener('click', deleteSelected);
      return;
    }
    const id = [...selectedIds][0];
    const n = (chart.notes||[]).find(n=>n.id===id);
    if(!n){ el.inspector.innerHTML = '<p class="placeholder">ノーツをクリックして選択</p>'; return; }
    const meta = TYPE_META[n.type]||{color:'#888',label:n.type};
    el.inspector.innerHTML = `
      <div class="note-card">
        <span class="type-tag" style="background:${meta.color}22;color:${meta.color};border:1px solid ${meta.color}55;">${meta.label}</span>
        <div class="stat-row"><span class="k">ID</span><span class="v">${n.id}</span></div>
        <div class="stat-row"><span class="k">Tick</span><span class="v">${n.tick}</span></div>
        <div class="stat-row"><span class="k">Beat</span><span class="v">${(n.tick/resolution).toFixed(2)}</span></div>
        <div class="stat-row"><span class="k">Lane</span><span class="v">${n.lane}</span></div>
        ${n.type==='hold' ? `<div class="stat-row"><span class="k">EndTick</span><span class="v">${n.endTick}</span></div>
        <div class="stat-row"><span class="k">長さ</span><span class="v">${n.endTick-n.tick} tick</span></div>` : ''}
        <button class="del-btn" id="inspDelete">このノーツを削除</button>
      </div>
    `;
    document.getElementById('inspDelete').addEventListener('click', ()=>deleteNoteById(n.id));
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------------------------------------------------------
  // Metadata modal
  // ---------------------------------------------------------------
  // 不要になった入力フィールドのデータバインディングを消してるよ
  function openMetaModal(){
    if(!chart) return;
    const m = chart.metadata;
    el.m_id.value = m.id||'';
    el.m_title.value = m.title||'';
    el.m_artist.value = m.artist||'';
    el.m_charter.value = m.charter||'';
    el.m_diffName.value = (m.difficulty&&m.difficulty.name)||'';
    el.m_diffLevel.value = (m.difficulty&&m.difficulty.level!=null)?m.difficulty.level:0;
    el.m_audioFile.value = (m.audio&&m.audio.file)||'';
    el.m_audioOffset.value = (m.audio&&m.audio.offset!=null)?m.audio.offset:0;
    el.m_jacketFile.value = (m.jacket&&m.jacket.file)||'';
    el.m_laneCount.value = m.laneCount||6;
    el.m_resolution.value = m.resolution||960;
    el.metaModalOverlay.classList.add('open');
  }
  function closeMetaModal(){ el.metaModalOverlay.classList.remove('open'); }
  el.metaCancel.addEventListener('click', closeMetaModal);
  el.metaModalOverlay.addEventListener('click', (e)=>{ if(e.target===el.metaModalOverlay) closeMetaModal(); });

  el.metaSave.addEventListener('click', ()=>{
    const newLaneCount = parseInt(el.m_laneCount.value,10) || 6;
    const newResolution = parseInt(el.m_resolution.value,10) || 960;

    if(newLaneCount < laneCount){
      const orphaned = (chart.notes||[]).filter(n=>n.lane >= newLaneCount).length;
      if(orphaned>0){
        const ok = confirm(orphaned+' 件のノーツがレーン範囲外になります。続行しますか？');
        if(!ok) return;
      }
    }

    chart.metadata.id = el.m_id.value;
    chart.metadata.title = el.m_title.value;
    chart.metadata.artist = el.m_artist.value;
    chart.metadata.charter = el.m_charter.value;
    chart.metadata.difficulty = { name: el.m_diffName.value, level: parseFloat(el.m_diffLevel.value)||0 };
    chart.metadata.audio = {
      file: el.m_audioFile.value,
      offset: parseFloat(el.m_audioOffset.value)||0
    };
    chart.metadata.jacket = { file: el.m_jacketFile.value };
    chart.metadata.laneCount = newLaneCount;
    chart.metadata.resolution = newResolution;

    laneCount = newLaneCount;
    resolution = newResolution;

    buildLaneHeader();
    resizeCanvas();
    draw();
    updateMetaStats();
    updateFooterCounts();
    closeMetaModal();
  });

  // ---------------------------------------------------------------
  // Audio
  // ---------------------------------------------------------------
  function onAudioChosen(e){
    const file = e.target.files[0];
    if(!file) return;
    if(audioObjectUrl) URL.revokeObjectURL(audioObjectUrl);
    audioObjectUrl = URL.createObjectURL(file);
    audio.src = audioObjectUrl;
    if(chart){
      chart.metadata.audio = chart.metadata.audio || {};
      chart.metadata.audio.file = file.name;
      updateMetaStats();
    }
    el.audioFileLabel.textContent = file.name;
    el.transport.classList.remove('disabled');
    el.btnPlayPause.disabled = false;
    el.seekBar.disabled = false;
    e.target.value = '';
  }

  audio.addEventListener('loadedmetadata', ()=>{
    el.seekBar.max = String(Math.floor(audio.duration*100));
    // ここでJSONにメタデータとして長さを保存するのをやめたよ
    updateTimeLabel();

    if(chart){
      resizeCanvas();
      draw();
      updateMetaStats();
      updateFooterCounts();
    }
  });
  audio.addEventListener('timeupdate', ()=>{
    if(!seekBarDragging){ el.seekBar.value = String(Math.floor(audio.currentTime*100)); }
    updateTimeLabel();
  });
  audio.addEventListener('play', ()=>{ el.btnPlayPause.innerHTML='<span class="material-symbols-outlined">pause</span>'; startRaf(); });
  audio.addEventListener('pause', ()=>{ el.btnPlayPause.innerHTML='<span class="material-symbols-outlined">play_arrow</span>'; stopRaf(); draw(); });
  audio.addEventListener('ended', ()=>{ el.btnPlayPause.innerHTML='<span class="material-symbols-outlined">play_arrow</span>'; stopRaf(); draw(); });

  el.btnPlayPause.addEventListener('click', togglePlay);
  function togglePlay(){
    if(!audio.src) return;
    if(audio.paused) audio.play(); else audio.pause();
  }

  el.seekBar.addEventListener('mousedown', ()=>{ seekBarDragging = true; });
  el.seekBar.addEventListener('input', ()=>{
    if(!audio.src) return;
    audio.currentTime = parseFloat(el.seekBar.value)/100;
    updateTimeLabel();
    draw();
  });
  el.seekBar.addEventListener('change', ()=>{ seekBarDragging = false; });

  function fmtTime(sec){
    if(!isFinite(sec) || sec<0) sec = 0;
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  function updateTimeLabel(){
    el.timeLabel.textContent = fmtTime(audio.currentTime)+' / '+fmtTime(audio.duration||0);
  }

  function startRaf(){
    stopRaf();
    function loop(){
      if(chart){
        draw();
        const curTick = tickForAudioTime(audio.currentTime||0);
        const py = tickToY(curTick);
        const wantTop = py - el.scrollWrap.clientHeight*0.3;
        el.scrollWrap.scrollTop = Math.max(0, wantTop);
      }
      rafHandle = requestAnimationFrame(loop);
    }
    rafHandle = requestAnimationFrame(loop);
  }
  function stopRaf(){ if(rafHandle){ cancelAnimationFrame(rafHandle); rafHandle=null; } }

  // ---------------------------------------------------------------
  // Export
  // ---------------------------------------------------------------
  async function exportChart(){
    if(!chart) return;
    const sorted = sortedNotes();
    const out = Object.assign({}, chart, { notes: sorted });
    const jsonStr = JSON.stringify(out, null, 2);

    if (!window.showSaveFilePicker) {
      const blob = new Blob([jsonStr], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename.endsWith('.json') ? filename : filename+'.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      return;
    }

    try {
      if (!currentFileHandle) {
        currentFileHandle = await window.showSaveFilePicker({
          suggestedName: filename.endsWith('.json') ? filename : filename + '.json',
          types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
        });
      }
      const writable = await currentFileHandle.createWritable();
      await writable.write(jsonStr);
      await writable.close();
      
      const file = await currentFileHandle.getFile();
      filename = file.name;
      el.filenameLabel.textContent = filename;
    } catch(err) {
      if (err.name !== 'AbortError') alert('保存に失敗しました: ' + err.message);
    }
  }

})();
</script>
</body>
</html>
